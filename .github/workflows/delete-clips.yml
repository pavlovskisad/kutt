name: Delete clips

# Manual only — never runs on push. Trigger from the Actions tab or via the
# GitHub API with a space-separated list of clip ids (filename without .mp4).
on:
  workflow_dispatch:
    inputs:
      clips:
        description: "Clip ids to delete, space-separated (e.g. kutt_2026-09-08_17-44-36_120s)"
        required: true

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate ids
        env:
          CLIPS: ${{ inputs.clips }}
        run: |
          # Only accept the exact filename shape the API generates, so nothing
          # else can ever reach rm on the server.
          for c in $CLIPS; do
            [[ "$c" =~ ^kutt_[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{2}-[0-9]{2}-[0-9]{2}_[0-9]+s$ ]] \
              || { echo "refusing invalid id: $c"; exit 1; }
          done
          echo "ok: $CLIPS"

      - name: Set up SSH
        run: |
          H=$(tr -d ' \r\n' < ops/host)
          [ -n "$H" ] || { echo "ops/host is empty — no server configured"; exit 1; }
          echo "VPS_HOST=$H" >> "$GITHUB_ENV"
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$H" >> ~/.ssh/known_hosts

      - name: Delete on VPS
        env:
          CLIPS: ${{ inputs.clips }}
        run: |
          ssh -i ~/.ssh/deploy_key root@$VPS_HOST "cd /opt/kutt/clips && for f in $CLIPS; do \
            if [ -f \$f.mp4 ]; then rm -f \$f.mp4 thumbs/\$f.webp; echo \"deleted \$f\"; else echo \"not found \$f\"; fi; \
          done; echo \"remaining: \$(ls *.mp4 2>/dev/null | wc -l) clips\""
