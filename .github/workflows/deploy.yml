name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          # Secret is the private key base64-encoded to a single line (paste-proof)
          echo "${{ secrets.VPS_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 77.42.76.62 >> ~/.ssh/known_hosts

      - name: Upload files
        run: |
          ssh -i ~/.ssh/deploy_key root@77.42.76.62 "mkdir -p /tmp/kutt-deploy"
          scp -i ~/.ssh/deploy_key server.js index.html app.html overview.html og.png root@77.42.76.62:/tmp/kutt-deploy/

      - name: Install files and restart API if needed
        run: |
          ssh -i ~/.ssh/deploy_key root@77.42.76.62 'bash -s' < .github/scripts/remote-deploy.sh

      - name: Health check
        run: |
          # /api/buffer-info goes through nginx to the Node API — real API liveness.
          # (/health falls through to index.html: no nginx location for it.)
          for i in 1 2 3 4 5; do
            if curl -sf https://kutt.cam/api/buffer-info; then
              echo ""
              echo "deploy OK"
              exit 0
            fi
            sleep 3
          done
          echo "health check failed"
          exit 1
