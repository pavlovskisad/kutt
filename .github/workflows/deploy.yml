name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 77.42.76.62 >> ~/.ssh/known_hosts

      - name: Upload files
        run: |
          ssh -i ~/.ssh/deploy_key root@77.42.76.62 "mkdir -p /tmp/kutt-deploy"
          scp -i ~/.ssh/deploy_key server.js index.html overview.html root@77.42.76.62:/tmp/kutt-deploy/

      - name: Install files and restart API if needed
        run: |
          ssh -i ~/.ssh/deploy_key root@77.42.76.62 'bash -s' < .github/scripts/remote-deploy.sh

      - name: Health check
        run: |
          for i in 1 2 3 4 5; do
            if curl -sf https://kutt.cam/health; then
              echo ""
              echo "deploy OK"
              exit 0
            fi
            sleep 3
          done
          echo "health check failed"
          exit 1
