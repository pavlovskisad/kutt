# /etc/nginx/sites-available/kutt — installed by ops/bootstrap.sh on a fresh
# server, BEFORE certbot. certbot then edits the live file in place (adds the
# `listen 443 ssl` + certificate lines marked "# managed by Certbot"), so after
# that the live file is no longer identical to this one. bootstrap.sh only
# writes it while no certificate has been installed into it yet.

server {
    listen 80 default_server;
    server_name kutt.cam;
    root /var/www/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /hls/ {
        proxy_pass http://127.0.0.1:8888/;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control no-cache;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3333/api/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /thumbs/ {
        proxy_pass http://127.0.0.1:3333/thumbs/;
    }

    location /clips/ {
        proxy_pass http://127.0.0.1:3333/clips/;
    }
}

server {
    listen 80;
    server_name kutt.online;
    return 301 https://kutt.cam$request_uri;
}
